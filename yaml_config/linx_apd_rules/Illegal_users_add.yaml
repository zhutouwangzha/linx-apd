- rule: Unauthorized Modification of /etc/passwd or /etc/shadow
  desc: Detects any modification to /etc/passwd or /etc/shadow by processes other than useradd and userdel
  condition: >
    evt.type in (open, openat) and 
    evt.dir = < and (
      fd.name contains /etc/passwd or 
      fd.name contains /etc/shadow
    ) and 
    evt.arg.flags contains "WR" and not 
    evt.arg.flags contains "RD" and not 
    proc.name = systemd and not (
      proc.name in ("useradd", "userdel")
    )
  output: >
    Unauthorized modification of sensitive file (user=%user.name command=%proc.cmdline file=%fd.name pid=%proc.pid ppid=%proc.ppid)
  priority: WARNING
  tags:
    - system
    - security
  chdesc:  非法增加新用户
  notify:
    title: 非法新增用户
    content: 检测到未通过useradd，userdel管理用户，而是直接修改/etc/passwd或/etc/shadow文件，可能存在潜在的黑客攻击。 
