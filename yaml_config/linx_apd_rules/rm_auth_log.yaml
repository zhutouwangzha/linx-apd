- rule: Detect the behavior of clearing the log
  desc: Detect when echo "" command is executed to clear .log file
  condition: >
    evt.type in (open,openat) and 
    evt.dir = < and 
    fd.directory contains /var/log and (
      fd.name contains secure or 
      fd.name contains audit.log
    ) and (
      evt.arg.flags contains "WR" or (
        proc.name = sed and 
        evt.arg.flags contains "RD"
      )
    ) and not 
    proc.name = systemd and not 
    proc.name = sshd and not 
    proc.name = pam_unix and not 
    proc.name = in:imjournal
  output: >
    ALERT: cleaning *.log detected (pid=%proc.pid ppid=%proc.ppid user=%user.name proc.name=%proc.name fd.name=%fd.name cmd=%proc.cmdline)
  priority: WARNING
  tags:
    - filesystem
    - suspicious
  notify:
    title: 攻击痕迹清理
    content: 检测到清空日志的行为，可能存在潜在的黑客攻击 。 
  chdesc: 日志清除
