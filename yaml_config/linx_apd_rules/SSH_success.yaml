- rule: SSH Login Success From Untrusted IP
  desc: Detects successful SSH login via PAM authentication from an untrusted IP address.
  condition: >
    evt.type = sendto and 
    proc.name = "sshd" and 
    evt.args icontains "PAM" and 
    evt.args icontains "authentication" and 
    evt.args icontains "res=success" and not 
    evt.args icontains "addr=172.30.103.52"
  output: >
    SSH login success from untrusted IP %fd.sip (pid=%proc.pid ppid=%proc.ppid user=%user.name command=%proc.cmdline location=%evt.args)
  priority:
    WARNING
  tags: 
    - ssh
    - auth
    - pam
    - authentication
    - success
    - network
  notify:
    title: SSH登录成功
    content: 检测到一次白名单外SSH登录成功事件
  chdesc: SSH登陆成功
